# Council-01: build gate.
# Runs the full composed build (typecheck + size lint + Vitest + bundle +
# minimize + verify) on every PR and every push to main. Playwright e2e
# runs as a separate job so bundler iteration stays fast.
#
# Per architecture-standards §6, `npm run build` fails on the first stage
# error. That guarantees "tests run at build time" is enforced, not
# aspirational.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run composed build (check + lint:size + test:run + bundle + minify + verify)
        run: npm run build

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-public
          path: dist/public
          retention-days: 7

  e2e:
    # Pinned 2026-10-30: ubuntu-latest moved to Ubuntu 26.04, which Playwright
    # 1.59.x cannot install chromium dependencies on ("does not support chromium
    # on ubuntu26.04-x64"). REVIEW when Playwright supports the latest Ubuntu
    # LTS image, then return to ubuntu-latest. Tracked in the repository issue
    # "Return e2e runner to ubuntu-latest" and docs/EXCEPTIONS.md E-10.
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npm run test:e2e
